<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC9A8"/>
      <stop offset="50%" stop-color="#C8A97E"/>
      <stop offset="100%" stop-color="#9E7D4E"/>
    </linearGradient>
    <radialGradient id="lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1815"/>
      <stop offset="70%" stop-color="#0E0D0C"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="#0A0A0A"/>
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <!-- Outer lens ring -->
  <circle cx="64" cy="64" r="46" fill="url(#lens)" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>
  <!-- Aperture blades -->
  <circle cx="64" cy="64" r="28" fill="#0A0A0A" stroke="url(#gold)" stroke-width="2"/>
  <path d="M64 36 L78 52" stroke="url(#gold)" stroke-width="2"/>
  <path d="M84 48 L86 68" stroke="url(#gold)" stroke-width="2"/>
  <path d="M88 68 L76 86" stroke="url(#gold)" stroke-width="2"/>
  <path d="M72 88 L52 86" stroke="url(#gold)" stroke-width="2"/>
  <path d="M46 80 L42 60" stroke="url(#gold)" stroke-width="2"/>
  <path d="M44 56 L58 40" stroke="url(#gold)" stroke-width="2"/>
  <!-- Center flare / optic -->
  <circle cx="64" cy="64" r="14" fill="url(#gold)" opacity="0.85"/>
  <circle cx="60" cy="60" r="5" fill="#FFFFFF" opacity="0.6"/>
</svg>
